# herdr-plugin.toml — manifest for herdr-space-scoped-agents.
#
# Scopes the agent panel to the focused space (mode "current"), the focused
# machine (mode "machine"), or shows every space (mode "all") by driving Herdr's
# transient agent view over the API socket. The chosen mode is persisted in the
# plugin state dir; the startup and workspace hooks run "sync" to (re)assert it.
#
# Distribution: [[build]] runs at `herdr plugin install` time. The per-platform
# fetch-or-build script downloads the prebuilt binary matching this version and
# platform from GitHub Releases and verifies its SHA-256; on any miss it falls
# back to `go build` (so a Go toolchain is only needed when no prebuilt exists).
#
# Windows notes (following the herdr-file-viewer plugin's verified findings):
#  - Actions need a UNIQUE id even across platforms — Herdr rejects duplicate
#    action ids at load time regardless of platform gating. The Windows
#    launchers therefore use `-windows`-suffixed ids; bind THOSE on Windows.
#  - Herdr cannot reliably spawn a relative program on Windows, so every
#    command launches the binary BY ABSOLUTE PATH via $HERDR_PLUGIN_ROOT
#    (stripping the `\\?\` verbatim prefix Herdr may report).

id = "herdr-space-scoped-agents"
name = "Space-Scoped Agents"
version = "0.6.0" # x-release-please-version
min_herdr_version = "0.7.5"
description = "Scope the agent panel to the focused space or machine."
platforms = ["linux", "macos", "windows"]

# --- Install-time build ------------------------------------------------------

[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/fetch-or-build.ps1"]

# --- Startup: re-apply the persisted mode as soon as the server is up ---------

[[startup]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/herdr-space-scoped-agents" sync']

[[startup]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'bin\herdr-space-scoped-agents.exe') sync''']

# --- Automatic behaviour: re-assert the active mode on every space switch -----
# Runs "sync", which applies the persisted mode ("current" scopes to the focused
# space, "machine" to the focused machine, "all" leaves everything visible).
# This is what makes the chosen mode stick instead of being overwritten on the
# next focus change.

[[events]]
on = "workspace.focused"
platforms = ["linux", "macos"]
command = ["/bin/sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/herdr-space-scoped-agents" sync']

[[events]]
on = "workspace.focused"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'bin\herdr-space-scoped-agents.exe') sync''']

# Machine mode filters on this server's workspace ids; refresh when they change.
[[events]]
on = "workspace.created"
platforms = ["linux", "macos"]
command = ["/bin/sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/herdr-space-scoped-agents" sync']

[[events]]
on = "workspace.created"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'bin\herdr-space-scoped-agents.exe') sync''']

# Machine mode filters on this server's workspace ids; refresh when they change.
[[events]]
on = "workspace.closed"
platforms = ["linux", "macos"]
command = ["/bin/sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/herdr-space-scoped-agents" sync']

[[events]]
on = "workspace.closed"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'bin\herdr-space-scoped-agents.exe') sync''']

# --- Manual actions (bind to a key or `herdr plugin action invoke <id>`) ------
# current -> focused space, machine -> focused machine, all -> everything,
# toggle -> cycle all -> current -> machine -> all.
# Each persists the mode so it sticks across space switches and restarts.

[[actions]]
id = "current"
platforms = ["linux", "macos"]
title = "Space scope: only current space"
description = "Scope the agent panel to the focused space (persists)"
contexts = ["global"]
command = ["/bin/sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/herdr-space-scoped-agents" current']

[[actions]]
id = "machine"
platforms = ["linux", "macos"]
title = "Space scope: only current machine"
description = "Scope the agent panel to the focused machine (persists)"
contexts = ["global"]
command = ["/bin/sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/herdr-space-scoped-agents" machine']

[[actions]]
id = "all"
platforms = ["linux", "macos"]
title = "Space scope: show all agents"
description = "Show agents from every space (persists)"
contexts = ["global"]
command = ["/bin/sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/herdr-space-scoped-agents" all']

[[actions]]
id = "toggle"
platforms = ["linux", "macos"]
title = "Space scope: cycle all/space/machine"
description = "Cycle all -> current space -> current machine (persists)"
contexts = ["global"]
command = ["/bin/sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/herdr-space-scoped-agents" toggle']

[[actions]]
id = "current-windows"
platforms = ["windows"]
title = "Space scope: only current space"
description = "Scope the agent panel to the focused space (persists)"
contexts = ["global"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'bin\herdr-space-scoped-agents.exe') current''']

[[actions]]
id = "machine-windows"
platforms = ["windows"]
title = "Space scope: only current machine"
description = "Scope the agent panel to the focused machine (persists)"
contexts = ["global"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'bin\herdr-space-scoped-agents.exe') machine''']

[[actions]]
id = "all-windows"
platforms = ["windows"]
title = "Space scope: show all agents"
description = "Show agents from every space (persists)"
contexts = ["global"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'bin\herdr-space-scoped-agents.exe') all''']

[[actions]]
id = "toggle-windows"
platforms = ["windows"]
title = "Space scope: cycle all/space/machine"
description = "Cycle all -> current space -> current machine (persists)"
contexts = ["global"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'bin\herdr-space-scoped-agents.exe') toggle''']
